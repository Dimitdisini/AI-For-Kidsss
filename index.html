<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akademi AI for Kids — Modul 1: Detektif Pikiran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@700;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #020617;
      --bar-bg: #0b1329;
      --bar-border: #1e293b;
      --accent-blue: #2563eb;
      --accent-amber: #f59e0b;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: var(--font-main);
    }

    /* TOP MASTER HEADER (SIMPEL & LEGA) */
    #masterHeader {
      height: 56px;
      background: var(--bar-bg);
      border-bottom: 2px solid var(--bar-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      z-index: 1000;
      position: relative;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--accent-amber);
      color: #0f172a;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 5px;
      white-space: nowrap;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 900;
      color: #ffffff;
    }

    /* TABS NAVIGATOR (HANYA 3 TAB UTAMA) */
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn {
      height: 38px;
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 8px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      cursor: pointer;
      font-family: var(--font-main);
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #334155;
    }

    .tab-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 2px 0 #020617;
    }

    /* RIGHT ACTIONS (HANYA 2 TOMBOL PDF) */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pdf {
      font-family: var(--font-main);
      font-size: 0.76rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-guru {
      background: #0f172a;
      border: 1.5px solid #f59e0b;
      color: #fbbf24;
    }
    .btn-guru:hover {
      background: #f59e0b;
      color: #0f172a;
    }

    .btn-siswa {
      background: #0f172a;
      border: 1.5px solid #38bdf8;
      color: #38bdf8;
    }
    .btn-siswa:hover {
      background: #38bdf8;
      color: #0f172a;
    }

    /* IFRAME VIEWPORT */
    #contentViewport {
      width: 100%;
      height: calc(100vh - 56px);
      height: calc(100dvh - 56px);
      border: none;
      display: block;
      background: #020617;
    }
  </style>
</head>
<body>

  <!-- MASTER HEADER (SUPER RINGKAS, ZERO BINGUNG) -->
  <header id="masterHeader">
    
    <div class="brand-left">
      <div class="brand-badge">MODUL 01</div>
      <div class="brand-title">Detektif Pikiran</div>
    </div>

    <!-- HANYA 3 TAB UTAMA YANG DIBUTUHKAN -->
    <nav class="tabs-bar">
      <!-- TAB 1: MODUL AJAR GURU -->
      <button class="tab-btn active" id="tabBtn-1" onclick="openRoom(1)">
        <span>👨‍🏫 Modul Ajar Guru</span>
        <small style="opacity: 0.75; font-size: 0.7rem;">(Pegangan Mentor & SOP)</small>
      </button>

      <!-- TAB 2: BUKU & LEMBAR KERJA SISWA -->
      <button class="tab-btn" id="tabBtn-2" onclick="openRoom(2)">
        <span>🎒 Buku & Lembar Siswa</span>
        <small style="opacity: 0.75; font-size: 0.7rem;">(Materi Anak & Cerita)</small>
      </button>

      <!-- TAB 3: STUDIO INTERAKTIF -->
      <button class="tab-btn" id="tabBtn-3" onclick="openRoom(3)">
        <span>🎮 Studio Interaktif</span>
        <small style="opacity: 0.75; font-size: 0.7rem;">(Simulator Layar)</small>
      </button>
    </nav>

    <!-- TOMBOL DOWNLOAD PDF LANGSUNG -->
    <div class="top-actions">
      <a href="Modul 1 - Modul Ajar Resmi Fasilitator.pdf" download target="_blank" class="btn-pdf btn-guru" title="Unduh PDF Modul Ajar Guru (6 Halaman)">
        <span>📋 PDF Guru</span>
      </a>
      <a href="Modul 1 - Buku Materi Siswa Lengkap.pdf" download target="_blank" class="btn-pdf btn-siswa" title="Unduh PDF Buku & Lembar Siswa (7 Halaman)">
        <span>📘 PDF Siswa</span>
      </a>
    </div>

  </header>

  <!-- VIEWPORT TAMPILAN -->
  <iframe id="contentViewport" src="modul-1-modul-ajar-guru.html"></iframe>

  <script>
    const rooms = {
      1: {
        file: "modul-1-modul-ajar-guru.html",
        label: "Modul Ajar Guru"
      },
      2: {
        file: "modul-1-buku-materi-siswa.html",
        label: "Buku & Lembar Kerja Siswa"
      },
      3: {
        file: "studio.html",
        label: "Studio Interaktif Robo-Mochi"
      }
    };

    let activeRoomId = 1;

    function openRoom(roomId) {
      if (!rooms[roomId]) return;
      activeRoomId = roomId;

      // Update Tab Styles
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('tabBtn-' + roomId);
      if (activeBtn) activeBtn.classList.add('active');

      // Update Viewport
      const viewport = document.getElementById('contentViewport');
      if (viewport) {
        viewport.src = rooms[roomId].file;
      }
    }
  </script>

</body>
</html>
